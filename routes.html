<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanka Bus Trip - Routes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --lion: #8B0000; --gold: #F5A623; --green: #1A6B3C;
  --cream: #FFF8F0; --dark: #1A1A2E;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: var(--cream); color: var(--dark); }

/* Header & Tabs */
.header { background: linear-gradient(135deg, #8B0000, #C0392B); padding: 40px 20px; text-align: center; color: white; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.header h1 { font-size: 26px; }
.tabs { display: flex; background: white; border-bottom: 2px solid #eee; position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
.tab { padding: 15px 20px; font-size: 13px; font-weight: 600; color: #999; text-decoration: none; transition: 0.3s; flex: 1; text-align: center; }
.tab.active { color: var(--lion); border-bottom: 3px solid var(--lion); background: #fff0f0; }

/* Content */
.content { padding: 25px 15px; max-width: 800px; margin: 0 auto; animation: fadeIn 1s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sec-title { font-size: 18px; font-weight: 700; margin: 20px 0; color: var(--lion); }

/* Cards */
.route-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid var(--lion); }
.route-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 700; }
.rinfo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.ri { background: var(--cream); padding: 8px; border-radius: 8px; text-align: center; font-size: 12px; }
.rv { font-weight: 700; display: block; }
</style>
</head>
<body>

<div class="header">
    <h1>🗺️ Routes & Spots</h1>
    <p>Lanka Bus Trip Planner</p>
</div>

<div class="tabs">
    <a href="index.html" class="tab">📅 Plan</a>
    <a href="routes.html" class="tab active">🗺️ Routes</a>
    <a href="tips.html" class="tab">💡 Tips</a>
</div>

<div class="content">
    <div class="sec-title">🗺️ Main Bus Routes</div>
    
    <div class="route-card">
        <div class="route-header">Colombo ↔ Kandy <span>Intercity</span></div>
        <div class="rinfo">
            <div class="ri">Time<span class="rv">3.5 hrs</span></div>
            <div class="ri">Bus No<span class="rv">01 / 17</span></div>
            <div class="ri">Fare<span class="rv">Rs. 250+</span></div>
        </div>
    </div>

    <div class="route-card" style="border-left-color:var(--green)">
        <div class="route-header">Colombo ↔ Galle <span>Express</span></div>
        <div class="rinfo">
            <div class="ri">Time<span class="rv">1.5 hrs</span></div>
            <div class="ri">Bus No<span class="rv">EX 01</span></div>
            <div class="ri">Fare<span class="rv">Rs. 700+</span></div>
        </div>
    </div>
</div>

</body>
</html>
